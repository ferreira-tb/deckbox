packages:
  - "app"

dedupePeers: true
ignoreWorkspaceRootCheck: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@tauri-store/*"
  - "@tb-dev/*"
  - "@tsukilabs/*"

allowBuilds:
  vue-demi: false

overrides:
  vue: "=3.6.0-rc.2"

  brace-expansion@<=5.0.8: ^5.0.9
  flatted@<=3.4.1: ">=3.4.2"
  nanoid@<3.3.17: ^3.3.17
  yaml@<2.8.3: ">=2.8.3"
